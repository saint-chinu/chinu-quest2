<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101018" />
    <title>チヌクエスト2</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="pre-game">
      <div id="login-screen" class="pg-screen">
        <h1 class="pg-title">チヌクエスト2</h1>
        <div class="pg-field">
          <label for="login-id">ID</label>
          <input id="login-id" type="text" autocomplete="username" />
        </div>
        <div class="pg-field">
          <label for="login-password">パスワード</label>
          <input id="login-password" type="password" autocomplete="current-password" />
        </div>
        <p id="login-error" class="pg-error hidden"></p>
        <button id="login-submit" class="pg-button">ログイン／新規登録</button>
      </div>

      <div id="charmake-screen" class="pg-screen hidden">
        <h2 class="pg-title">キャラメイク</h2>
        <p class="pg-label">アイコンを選んでください</p>
        <div id="charmake-icons" class="pg-choice-row"></div>
        <div class="pg-field">
          <label for="charmake-name">名前</label>
          <input id="charmake-name" type="text" maxlength="10" />
        </div>
        <p class="pg-label">初期デッキを選んでください</p>
        <div id="charmake-decks" class="pg-choice-column"></div>
        <button id="charmake-submit" class="pg-button">はじめる</button>
      </div>

      <div id="hub-screen" class="pg-screen hidden">
        <h2 id="hub-welcome" class="pg-title"></h2>
        <div id="hub-tiles">
          <button class="hub-tile" data-mode="story">ストーリー</button>
          <button class="hub-tile" data-mode="battle">対戦</button>
          <button class="hub-tile" data-mode="deck">デッキ</button>
          <button class="hub-tile" data-mode="shop">ショップ</button>
          <button class="hub-tile" data-mode="breed">ブリード</button>
        </div>
      </div>

      <div id="deck-screen" class="pg-screen hidden">
        <h2 class="pg-title">デッキ編成</h2>
        <p id="deck-count" class="pg-label">0 / 40</p>
        <div id="deck-catalog-list"></div>
        <div class="pg-actions-row">
          <button id="deck-save" class="pg-button" disabled>保存</button>
          <button id="deck-back" class="pg-button pg-button-secondary">戻る</button>
        </div>
      </div>

      <div id="shop-screen" class="pg-screen hidden">
        <h2 class="pg-title">ショップ</h2>
        <p id="shop-currency" class="pg-label">所持G: 0</p>
        <div id="shop-list"></div>
        <button id="shop-back" class="pg-button pg-button-secondary">戻る</button>
      </div>

      <div id="battle-menu-screen" class="pg-screen hidden">
        <h2 class="pg-title">対戦</h2>
        <button id="battle-cpu" class="pg-button">CPU戦</button>
        <button id="battle-pvp" class="pg-button" disabled>対人戦（準備中）</button>
        <button id="battle-back" class="pg-button pg-button-secondary">戻る</button>
      </div>

      <div id="stub-screen" class="pg-screen hidden">
        <p id="stub-text" class="pg-label"></p>
        <button id="stub-back" class="pg-button pg-button-secondary">戻る</button>
      </div>
    </div>
    <div id="app" class="hidden">
      <canvas id="game-canvas"></canvas>
      <button id="exit-battle-button" aria-label="対戦をやめてMを受け取る">退出</button>
      <div id="hud">
        <div id="player-panel-0" class="player-panel corner-tl hidden"></div>
        <div id="player-panel-1" class="player-panel corner-tr hidden"></div>
        <div id="player-panel-2" class="player-panel corner-bl hidden"></div>
        <div id="player-panel-3" class="player-panel corner-br hidden"></div>
        <div id="log"></div>
        <div id="hand-panel"></div>
      </div>
      <div id="center-panel" class="hidden">
        <div id="dice-row">
          <button id="dice-button" aria-label="サイコロを振る">
            <span class="pip" data-pos="tl"></span><span class="pip" data-pos="tr"></span>
            <span class="pip" data-pos="ml"></span><span class="pip" data-pos="c"></span><span class="pip" data-pos="mr"></span>
            <span class="pip" data-pos="bl"></span><span class="pip" data-pos="br"></span>
          </button>
          <div id="turn-indicator">プレイヤーのターン</div>
        </div>
        <div id="center-hand"></div>
      </div>
      <div id="rotate-notice">画面を横向きにしてください</div>
      <div id="direction-arrows-overlay" class="hidden">
        <button id="dir-arrow-upleft" class="dir-arrow dir-arrow-upleft hidden" aria-label="左上へ進む">↖</button>
        <button id="dir-arrow-upright" class="dir-arrow dir-arrow-upright hidden" aria-label="右上へ進む">↗</button>
        <button id="dir-arrow-downleft" class="dir-arrow dir-arrow-downleft hidden" aria-label="左下へ進む">↙</button>
        <button id="dir-arrow-downright" class="dir-arrow dir-arrow-downright hidden" aria-label="右下へ進む">↘</button>
      </div>
      <div id="land-command-modal" class="hidden">
        <div id="land-command-box">
          <p id="land-command-title"></p>
          <div id="land-command-actions">
            <button id="land-command-summon">召喚／侵略</button>
            <button id="land-command-land">土地</button>
            <button id="land-command-end">終了</button>
          </div>
        </div>
      </div>
      <div id="land-submenu-modal" class="hidden">
        <div id="land-submenu-box">
          <p id="land-submenu-title"></p>
          <div id="land-submenu-actions">
            <button id="land-submenu-swap">入れ替え</button>
            <button id="land-submenu-levelup">土地Lvアップ</button>
            <button id="land-submenu-element">属性変更</button>
            <button id="land-submenu-move">移動</button>
            <button id="land-submenu-info">情報</button>
            <button id="land-submenu-back">もどる</button>
          </div>
        </div>
      </div>
      <div id="monster-picker-modal" class="hidden">
        <div id="monster-picker-box">
          <p>モンスターカードを選んでください</p>
          <div id="monster-picker-choices"></div>
          <button id="monster-picker-cancel">やめる</button>
        </div>
      </div>
      <div id="shop-tile-modal" class="hidden">
        <div id="shop-tile-box">
          <p>購入するカードを選んでください</p>
          <div id="shop-tile-choices"></div>
          <button id="shop-tile-cancel">やめる</button>
        </div>
      </div>
      <div id="element-picker-modal" class="hidden">
        <div id="element-picker-box">
          <p>変更する属性を選んでください</p>
          <div id="element-picker-choices"></div>
          <button id="element-picker-cancel">やめる</button>
        </div>
      </div>
      <div id="confirm-modal" class="hidden">
        <div id="confirm-box">
          <p id="confirm-text"></p>
          <div id="confirm-actions">
            <button id="confirm-yes">はい</button>
            <button id="confirm-no">いいえ</button>
          </div>
        </div>
      </div>
      <div id="camera-work-overlay" class="hidden">
        <button id="cam-arrow-up" class="cam-arrow cam-arrow-up" aria-label="上へ">▲</button>
        <button id="cam-arrow-down" class="cam-arrow cam-arrow-down" aria-label="下へ">▼</button>
        <button id="cam-arrow-left" class="cam-arrow cam-arrow-left" aria-label="左へ">◀</button>
        <button id="cam-arrow-right" class="cam-arrow cam-arrow-right" aria-label="右へ">▶</button>
        <button id="cam-work-back">戻る</button>
      </div>
      <div id="tile-info-modal" class="hidden">
        <div id="tile-info-box">
          <p id="tile-info-text"></p>
          <div id="tile-info-actions">
            <button id="tile-info-close">閉じる</button>
          </div>
        </div>
      </div>
      <div id="card-reveal-modal" class="hidden">
        <div id="card-reveal-box">
          <p id="card-reveal-title">カードを引いた</p>
          <div id="card-reveal-card" class="card card-large"></div>
        </div>
      </div>
      <div id="discard-modal" class="hidden">
        <div id="discard-box">
          <p id="discard-hint">手札が7枚になりました。捨てるカードを選んでください</p>
          <div id="discard-choices"></div>
        </div>
      </div>
      <div id="card-detail-modal" class="hidden">
        <div id="card-detail-box">
          <div id="card-detail-card" class="card card-large"></div>
          <p id="card-detail-text"></p>
          <div id="card-detail-actions">
            <button id="card-detail-use" class="hidden">使用する</button>
            <button id="card-detail-close">閉じる</button>
          </div>
        </div>
      </div>
      <div id="spell-effect-modal" class="hidden">
        <p id="spell-effect-text"></p>
      </div>
      <div id="battle-scene-modal" class="hidden">
        <div id="battle-fade"></div>
        <div id="battle-stage">
          <div id="battle-side-attacker" class="battle-side">
            <div class="battle-panel">
              <p id="battle-attacker-owner" class="battle-owner-name"></p>
              <p class="battle-stat-line">HP <span id="battle-attacker-hp"></span><span id="battle-attacker-hp-bonus" class="battle-bonus hidden"></span></p>
              <p class="battle-stat-line">ATK <span id="battle-attacker-atk"></span><span id="battle-attacker-atk-bonus" class="battle-bonus hidden"></span></p>
            </div>
            <div class="battle-card-wrap">
              <div id="battle-attacker-card" class="card card-large"></div>
              <div id="battle-attacker-item" class="battle-item-overlay hidden"></div>
              <p id="battle-attacker-dmg" class="battle-damage-popup hidden"></p>
            </div>
          </div>
          <div id="battle-vs">VS</div>
          <div id="battle-side-defender" class="battle-side">
            <div class="battle-panel">
              <p id="battle-defender-owner" class="battle-owner-name"></p>
              <p class="battle-stat-line">HP <span id="battle-defender-hp"></span><span id="battle-defender-hp-bonus" class="battle-bonus hidden"></span></p>
              <p class="battle-stat-line">ATK <span id="battle-defender-atk"></span><span id="battle-defender-atk-bonus" class="battle-bonus hidden"></span></p>
            </div>
            <div class="battle-card-wrap">
              <div id="battle-defender-card" class="card card-large"></div>
              <div id="battle-defender-item" class="battle-item-overlay hidden"></div>
              <p id="battle-defender-dmg" class="battle-damage-popup hidden"></p>
            </div>
          </div>
        </div>
        <div id="battle-item-picker-box" class="hidden">
          <p id="battle-item-picker-title"></p>
          <div id="battle-item-picker-choices"></div>
          <button id="battle-item-picker-skip">使わない</button>
        </div>
        <p id="battle-outcome-text" class="hidden"></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
