<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101018" />
    <title>チヌクエスト2</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <div id="player-panel-0" class="player-panel corner-tl hidden"></div>
        <div id="player-panel-1" class="player-panel corner-tr hidden"></div>
        <div id="player-panel-2" class="player-panel corner-bl hidden"></div>
        <div id="player-panel-3" class="player-panel corner-br hidden"></div>
        <div id="log"></div>
        <div id="hand-panel"></div>
      </div>
      <div id="center-panel" class="hidden">
        <div id="dice-row">
          <button id="dice-button" aria-label="サイコロを振る">
            <span class="pip" data-pos="tl"></span><span class="pip" data-pos="tr"></span>
            <span class="pip" data-pos="ml"></span><span class="pip" data-pos="c"></span><span class="pip" data-pos="mr"></span>
            <span class="pip" data-pos="bl"></span><span class="pip" data-pos="br"></span>
          </button>
          <div id="turn-indicator">プレイヤーのターン</div>
        </div>
        <div id="center-hand"></div>
      </div>
      <div id="rotate-notice">画面を横向きにしてください</div>
      <div id="land-command-modal" class="hidden">
        <div id="land-command-box">
          <p id="land-command-title"></p>
          <div id="land-command-actions">
            <button id="land-command-summon">A: 召喚／侵略</button>
            <button id="land-command-levelup">B: 土地レベルアップ</button>
            <button id="land-command-info">C: 土地情報</button>
            <button id="land-command-end">ターン終了</button>
          </div>
        </div>
      </div>
      <div id="monster-picker-modal" class="hidden">
        <div id="monster-picker-box">
          <p>モンスターカードを選んでください</p>
          <div id="monster-picker-choices"></div>
          <button id="monster-picker-cancel">やめる</button>
        </div>
      </div>
      <div id="confirm-modal" class="hidden">
        <div id="confirm-box">
          <p id="confirm-text"></p>
          <div id="confirm-actions">
            <button id="confirm-yes">はい</button>
            <button id="confirm-no">いいえ</button>
          </div>
        </div>
      </div>
      <div id="tile-info-modal" class="hidden">
        <div id="tile-info-box">
          <p id="tile-info-text"></p>
          <button id="tile-info-close">閉じる</button>
        </div>
      </div>
      <div id="card-reveal-modal" class="hidden">
        <div id="card-reveal-box">
          <p id="card-reveal-title">カードを引いた</p>
          <div id="card-reveal-card" class="card card-large"></div>
        </div>
      </div>
      <div id="discard-modal" class="hidden">
        <div id="discard-box">
          <p>手札が7枚になりました。捨てるカードを選んでください</p>
          <div id="discard-choices"></div>
        </div>
      </div>
      <div id="card-detail-modal" class="hidden">
        <div id="card-detail-box">
          <div id="card-detail-card" class="card card-large"></div>
          <p id="card-detail-text"></p>
          <div id="card-detail-actions">
            <button id="card-detail-use" class="hidden">使用する</button>
            <button id="card-detail-close">閉じる</button>
          </div>
        </div>
      </div>
      <div id="spell-effect-modal" class="hidden">
        <p id="spell-effect-text"></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
