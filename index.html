<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101018" />
    <title>チヌクエスト2</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <div id="top-row">
          <div id="turn-indicator">プレイヤーのターン</div>
          <div id="currency-panel"></div>
        </div>
        <div id="log"></div>
        <div id="hand-panel"></div>
        <button id="dice-button">サイコロを振る</button>
      </div>
      <div id="rotate-notice">画面を横向きにしてください</div>
      <div id="purchase-modal" class="hidden">
        <div id="purchase-box">
          <p id="purchase-text"></p>
          <div id="purchase-actions">
            <button id="purchase-yes">購入する</button>
            <button id="purchase-no">スキップ</button>
          </div>
        </div>
      </div>
      <div id="card-reveal-modal" class="hidden">
        <div id="card-reveal-box">
          <p id="card-reveal-title">カードを引いた</p>
          <div id="card-reveal-card" class="card card-large"></div>
          <button id="card-reveal-ok">OK</button>
        </div>
      </div>
      <div id="discard-modal" class="hidden">
        <div id="discard-box">
          <p>手札が7枚になりました。捨てるカードを選んでください</p>
          <div id="discard-choices"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
